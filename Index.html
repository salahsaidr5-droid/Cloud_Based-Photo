<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Photo Processor | Salah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: white; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen p-6 relative">
    <div class="max-w-6xl mx-auto relative z-10">
        <header class="flex justify-between items-center mb-12 animate-fade-in">
            <div>
                <h1 class="text-4xl font-bold gradient-text">Cloud Processor</h1>
                <p class="text-gray-400 mt-2">Serverless Photo Management System</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="glass p-8 rounded-3xl shadow-2xl">
                    <h2 class="text-xl font-bold mb-6 flex items-center">Upload Asset</h2>
                    <div id="drop-zone" class="border-2 border-dashed border-blue-500/30 rounded-2xl p-10 text-center hover:border-blue-500 transition-all cursor-pointer bg-blue-500/5 group">
                        <input type="file" id="fileInput" class="hidden" accept="image/*">
                        <div class="text-4xl mb-4 group-hover:scale-110 transition-transform">☁️</div>
                        <p class="text-sm text-gray-400">Click or Drag Image Here</p>
                    </div>
                    <button onclick="uploadToCloud()" id="uploadBtn" class="w-full mt-6 bg-gradient-to-r from-blue-600 to-purple-600 py-4 rounded-xl font-bold hover:opacity-90 transition shadow-lg shadow-blue-500/20">
                        Process & Save
                    </button>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="glass p-8 rounded-3xl min-h-[500px]">
                    <h2 class="text-xl font-bold mb-8">Asset Gallery</h2>
                    <div id="gallery" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://ii06n7z4eb.execute-api.eu-north-1.amazonaws.com/prod/data";

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('drop-zone');

        dropZone.onclick = () => fileInput.click();

        async function uploadToCloud() {
            const file = fileInput.files[0];
            if (!file) return alert("Please select a file first");

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64Content = reader.result.split(',')[1];
                const btn = document.getElementById('uploadBtn');
                btn.innerText = "Processing...";
                btn.disabled = true;

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            file_name: file.name,
                            file_content: base64Content
                        })
                    });
                    if (response.ok) {
                        alert("Success!");
                        loadImages();
                    }
                } catch (err) {
                    alert("Upload failed");
                } finally {
                    btn.innerText = "Process & Save";
                    btn.disabled = false;
                }
            };
        }

        async function loadImages() {
            try {
                const response = await fetch(API_URL);
                const images = await response.json();
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = images.map(img => `
                    <div class="glass p-2 rounded-2xl animate-fade-in group hover:scale-[1.02] transition-all">
                        <img src="${img.URL}" class="w-full h-32 object-cover rounded-xl mb-3 shadow-inner">
                        <div class="flex justify-between items-center px-1">
                            <span class="text-[10px] text-gray-400 truncate w-20">${img.ID}</span>
                            <button onclick="deleteImage('${img.ID}')" class="text-red-400 hover:text-red-200 text-[10px] font-bold">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) { 
                console.error("Error loading images:", err); 
            }
        }

        async function deleteImage(imageID) {
            if (!confirm("Confirm deletion?")) return;
            try {
                const response = await fetch(`${API_URL}?file_name=${encodeURIComponent(imageID)}`, { 
                    method: 'DELETE' 
                });
                if (response.ok) {
                    loadImages();
                } else {
                    alert("Delete failed");
                }
            } catch (err) { 
                alert("Error connecting to server"); 
            }
        }

        window.onload = loadImages;
    </script>
</body>
</html>
